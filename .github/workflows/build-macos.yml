name: Transfer verified macOS release assets

on: workflow_dispatch

permissions:
  actions: read
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Jerryzjy/S3-File-Manager
      RELEASE_TAG: v1.3.0-rc.4
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 45763955684
          github-token: ${{ github.token }}
          pattern: S3FileManager-macos-*
          merge-multiple: true
          path: assets
      - name: Check draft assets and upload macOS disk images
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          stage="$(mktemp -d)"
          for arch in arm64 x86_64; do
            file="S3FileManager-1.3.0-rc.4-macos-$arch.dmg"
            test -s "assets/$file"
            cp "assets/$file" "$stage/$file"
          done
          (
            cd "$stage"
            gh release view "$RELEASE_TAG" --json assets | jq -r '.assets[] | select(.name | contains("-windows-x64")) | (.digest | sub("^sha256:"; "")) + "  " + .name' > SHA256SUMS.txt
            test "$(wc -l < SHA256SUMS.txt)" = 3
            sha256sum ./*.dmg | sed 's@  ./@  @' >> SHA256SUMS.txt
            gh release upload "$RELEASE_TAG" ./*.dmg SHA256SUMS.txt
          )
