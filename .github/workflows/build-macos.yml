name: Transfer verified macOS release assets

on: workflow_dispatch

permissions:
  actions: read
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Jerryzjy/S3-File-Manager
      RELEASE_TAG: v1.3.0
    steps:
      - name: Download artifacts from the stable build
        uses: actions/download-artifact@v4
        with:
          run-id: 45791648017
          github-token: ${{ github.token }}
          pattern: S3FileManager-macos-*
          merge-multiple: true
          path: assets
      - name: Upload disk images and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          for arch in arm64 x86_64; do
            test -s "S3FileManager-1.3.0-macos-$arch.dmg"
          done
          gh release view "$RELEASE_TAG" --json assets | jq -r '.assets[] | select(.name | contains("-windows-x64")) | (.digest | sub("^sha256:"; "")) + "  " + .name' > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" = 3
          sha256sum S3FileManager-1.3.0-macos-arm64.dmg S3FileManager-1.3.0-macos-x86_64.dmg >> SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" S3FileManager-1.3.0-macos-arm64.dmg S3FileManager-1.3.0-macos-x86_64.dmg SHA256SUMS.txt
