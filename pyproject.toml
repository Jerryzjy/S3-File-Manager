[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r2-batch-downloader"
version = "1.3.0"
license = {file = "LICENSE"}
description = "S3 File Manager desktop client for R2 uploads and batch downloads from S3-compatible storage"
requires-python = ">=3.10"
dependencies = ["boto3>=1.36", "PySide6-Essentials>=6.8", "qtawesome>=1.4", "packaging>=23",
    "keyring>=25.7; sys_platform == 'darwin'", "cryptography>=44; sys_platform == 'darwin'"]

[project.scripts]
r2-batch-download = "r2_batch_download.cli:main"

[project.urls]
Repository = "https://github.com/Jerryzjy/S3-File-Manager"
Releases = "https://github.com/Jerryzjy/S3-File-Manager/releases"

[project.gui-scripts]
r2-downloader = "r2_batch_download.client:main"

[tool.setuptools.packages.find]
include = ["r2_batch_download*"]

[tool.setuptools.package-data]
r2_batch_download = ["preview_assets/*.png", "preview_assets/*.ico", "preview_assets/*.icns"]
